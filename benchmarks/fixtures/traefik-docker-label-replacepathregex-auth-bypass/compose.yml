services:
  proxy:
    image: traefik:v3.7.6
    command:
      - "--entrypoints.web.address=:8080"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--api=false"
    ports:
      - "127.0.0.1:${TRAEFIK_BENCHMARK_PORT:-18080}:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
  backend:
    image: node:22.23.1-alpine
    working_dir: /app
    command: ["node", "src/backend.mjs"]
    volumes:
      - "./src:/app/src:ro"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cps-docker-label-public.rule=PathPrefix(`/cps-benchmark-api`)"
      - "traefik.http.routers.cps-docker-label-public.entrypoints=web"
      - "traefik.http.routers.cps-docker-label-public.middlewares=cps-docker-label-rewrite"
      - "traefik.http.routers.cps-docker-label-public.service=cps-docker-label-backend"
      - "traefik.http.routers.cps-docker-label-protected.rule=PathPrefix(`/cps-benchmark-admin`)"
      - "traefik.http.routers.cps-docker-label-protected.entrypoints=web"
      - "traefik.http.routers.cps-docker-label-protected.middlewares=cps-docker-label-auth"
      - "traefik.http.routers.cps-docker-label-protected.service=cps-docker-label-backend"
      - "traefik.http.middlewares.cps-docker-label-rewrite.replacepathregex.regex=^/cps-benchmark-api(.*)"
      - "traefik.http.middlewares.cps-docker-label-rewrite.replacepathregex.replacement=/$${1}"
      - "traefik.http.middlewares.cps-docker-label-auth.basicauth.users=benchmark:$$apr1$$H6uskkkW$$IgXLP6ewTrSuBkTrqE8wj/"
      - "traefik.http.services.cps-docker-label-backend.loadbalancer.server.port=3000"
