AWSTemplateFormatVersion: "2010-09-09"
Description: Public administrator role benchmark
Resources:
  PublicAdministratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: public-administrator
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: "*"
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      MaxSessionDuration: 3600
