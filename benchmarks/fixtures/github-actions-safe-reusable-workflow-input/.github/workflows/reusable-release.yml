name: Reusable release
on:
  workflow_call:
    inputs:
      release-name:
        required: true
        type: string
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          RELEASE_NAME: ${{ inputs.release-name }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          script: |
            core.info(`Publishing ${process.env.RELEASE_NAME}`);
