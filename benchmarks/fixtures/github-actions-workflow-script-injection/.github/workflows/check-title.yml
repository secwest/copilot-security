name: Check pull request title
on:
  pull_request_target:
    types: [opened, edited, synchronize]
permissions:
  contents: write
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        with:
          script: |
            core.info("Checking ${{ github.event.pull_request.title }}");
