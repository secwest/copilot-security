name: go-fixture-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Prove caller-controlled Go net/http dispatch
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-ssrf
      - name: Prove fixed selection and redirect rejection
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-safe-fetch
      - name: Prove request-derived Go filesystem traversal
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-path-traversal
      - name: Prove root-scoped Go file access
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-safe-rooted-file
      - name: Prove request-derived Go template execution
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-template-injection
      - name: Prove fixed Go template source with escaped request data
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-safe-template-data
      - name: Prove cross-account Go object disclosure
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-idor
      - name: Prove context-principal Go object authorization
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-safe-authorization
      - name: Prove cross-account Go collection disclosure
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-list-idor
      - name: Prove context-principal Go collection authorization
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-safe-list-authorization
      - name: Prove prepared Go cross-account object deletion
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-prepared-delete-idor
      - name: Prove principal-scoped prepared Go deletion
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-safe-prepared-delete-authorization
      - name: Prove request-derived Go shell command grammar
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-shell-command-injection
      - name: Prove fixed Go shell command selection
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-safe-shell-command
      - name: Prove request-derived manual Go Cmd shell grammar
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-manual-cmd-shell-injection
      - name: Prove fixed manual Go Cmd command selection
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-safe-manual-cmd-shell-command
      - name: Prove request-derived Go database query grammar
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-sql-injection
      - name: Prove database placeholder binding
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-safe-sql
      - name: Prove request-derived sqlx Select query grammar
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-sqlx-sqli
      - name: Prove sqlx placeholder binding
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-safe-sqlx
      - name: Prove request-derived GORM Raw query grammar
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-gorm-sqli
      - name: Prove GORM placeholder binding
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-safe-gorm
      - name: Prove request-derived GORM generics Where grammar
        run: go test ./...
        working-directory: benchmarks/fixtures/go-gorm-generics-sqli
      - name: Prove GORM generics placeholder binding
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-safe-gorm-generics
      - name: Prove request-derived Squirrel query grammar
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-squirrel-sqli
      - name: Prove Squirrel placeholder binding
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-safe-squirrel
      - name: Prove request-derived pgx v5 query grammar
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-pgx-sqli
      - name: Prove pgx v5 placeholder binding
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-safe-pgx
      - name: Prove custom pgx QueryRewriter SQL grammar
        run: go test ./...
        working-directory: benchmarks/fixtures/go-pgx-query-rewriter-sqli
      - name: Prove custom pgx QueryRewriter returned-argument isolation
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-safe-pgx-query-rewriter
      - name: Prove pgconn simple-protocol query grammar
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-pgconn-sqli
      - name: Prove pgconn extended-protocol parameter isolation
        run: go test ./...
        working-directory: benchmarks/fixtures/go-cross-file-safe-pgconn
