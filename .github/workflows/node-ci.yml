name: node-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / node-${{ matrix.node == '22.13.0' && '22' || matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.13.0"]
        include:
          - os: ubuntu-latest
            node: "24.0.0"
          - os: ubuntu-latest
            node: "24"
          - os: ubuntu-latest
            node: "26.0.0"
          - os: ubuntu-latest
            node: "26"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: sdk/typescript/package.json
          cache: true
          cache_dependency_path: sdk/typescript/pnpm-lock.yaml

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/pnpm-lock.yaml

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: pnpm --dir sdk/typescript install --frozen-lockfile

      - name: Audit production dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.13.0'
        run: pnpm --dir sdk/typescript run audit:prod

      - name: Typecheck
        run: pnpm --dir sdk/typescript run types

      - name: Test
        timeout-minutes: 15
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: pnpm --dir sdk/typescript run test

      - name: Prove privileged PR execution and Checkout v7 protection
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.13.0'
        run: node benchmarks/witnesses/github-actions-pwn-request/PwnRequestWitness.mjs

      - name: Prove artifact poisoning and isolated typed-data validation
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.13.0'
        run: node benchmarks/witnesses/github-actions-artifact-poisoning/ArtifactPoisoningWitness.mjs

      - name: Prove reusable-workflow injection and native environment isolation
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.13.0'
        run: node benchmarks/witnesses/github-actions-reusable-workflow-injection/ReusableWorkflowInjectionWitness.mjs

      - name: Prove composite-action injection and step-environment isolation
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.13.0'
        run: node benchmarks/witnesses/github-actions-composite-action-injection/CompositeActionInjectionWitness.mjs

      - name: Prove same-workflow injection and intermediate environment isolation
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.13.0'
        run: node benchmarks/witnesses/github-actions-workflow-script-injection/WorkflowScriptInjectionWitness.mjs

      - name: Prove self-hosted runner persistence and hosted-runner isolation
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.13.0'
        run: node benchmarks/witnesses/github-actions-self-hosted-pr/SelfHostedPrWitness.mjs

      - name: Check formatting
        run: pnpm --dir sdk/typescript run format

      - name: Build
        run: pnpm --dir sdk/typescript run build

      - name: Pack
        working-directory: sdk/typescript
        run: pnpm pack --pack-destination ../../dist

      - name: Inspect package
        working-directory: sdk/typescript
        shell: bash
        run: pnpm run check:package ../../dist/*.tgz

      - name: Smoke-test Node.js runtime
        working-directory: sdk/typescript
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --eval '
            import { CopilotSecurity } from "@secwest/copilot-security";

            if (typeof CopilotSecurity !== "function") {
              throw new Error("The SDK does not export CopilotSecurity.");
            }
          '
          node bin/copilot-security.mjs --version
          node bin/copilot-security.mjs --help

  python-framework-fixtures:
    name: Python framework exploit/control witnesses
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install exact fixture dependencies
        run: |
          python3 -m venv "${{ runner.temp }}/fastapi-pydantic-witness"
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/pip" install \
            --disable-pip-version-check \
            --requirement benchmarks/fixtures/python-fastapi-pydantic-body-command-injection/requirements.txt
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/pip" install \
            --disable-pip-version-check \
            --requirement benchmarks/fixtures/python-flask-open-redirect/requirements.txt
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/pip" install \
            --disable-pip-version-check \
            --requirement benchmarks/fixtures/python-django-open-redirect/requirements.txt

      - name: Execute body-command and open-redirect exploit/control witnesses
        run: |
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-fastapi-pydantic-body-command-injection/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-fastapi-pydantic-body-safe-command/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-fastapi-annotated-pydantic-body-command-injection/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-fastapi-annotated-pydantic-body-safe-command/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-fastapi-embedded-pydantic-body-command-injection/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-fastapi-embedded-pydantic-body-safe-command/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-fastapi-open-redirect/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-fastapi-safe-local-redirect/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-fastapi-response-class-open-redirect/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-fastapi-response-class-safe-local-redirect/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-flask-open-redirect/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-flask-safe-local-redirect/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-flask-blueprint-open-redirect/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-flask-blueprint-safe-local-redirect/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-flask-post-open-redirect/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-flask-post-safe-local-redirect/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-django-open-redirect/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-django-safe-local-redirect/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-django-class-view-open-redirect/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-django-class-view-safe-local-redirect/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-django-post-class-view-open-redirect/examples/witness.py
          "${{ runner.temp }}/fastapi-pydantic-witness/bin/python" \
            benchmarks/fixtures/python-django-post-class-view-safe-local-redirect/examples/witness.py

  mcp-tool-fixtures:
    name: MCP tool witness / ${{ matrix.os }} / ${{ matrix.fixture }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        fixture:
          - node-mcp-v2-command-injection
          - node-mcp-v2-command-argv
          - node-mcp-v2-argument-injection
          - node-mcp-v2-argument-data
          - node-mcp-v2-code-injection
          - node-mcp-v2-arithmetic-parser
          - node-mcp-v2-function-constructor
          - node-mcp-v2-function-fixed-grammar
          - node-mcp-v2-worker-eval-injection
          - node-mcp-v2-worker-data-boundary
          - node-mcp-v2-sqlite-sql-injection
          - node-mcp-v2-sqlite-bound-parameters
          - node-mcp-v2-sqlite-prepared-sql-injection
          - node-mcp-v2-sqlite-prepared-bound-parameters
          - node-mcp-v2-regex-injection
          - node-mcp-v2-fixed-patterns
          - node-mcp-v2-ssrf
          - node-mcp-v2-fixed-destination
          - node-mcp-v2-path-traversal
          - node-mcp-v2-fixed-file
          - node-mcp-v2-runtime-alias-argument-injection
          - node-mcp-v2-runtime-alias-argument-data
          - node-mcp-v2-imported-runtime-argument-injection
          - node-mcp-v2-imported-runtime-argument-data
          - node-mcp-v2-fork-exec-argv-injection
          - node-mcp-v2-fork-argument-data
          - node-mcp-v2-fork-module-path-injection
          - node-mcp-v2-fork-fixed-module
          - node-mcp-v2-fork-exec-path-selection
          - node-mcp-v2-fork-fixed-executable
          - node-mcp-v2-fork-relative-cwd-module-hijack
          - node-mcp-v2-fork-absolute-module
          - node-mcp-v2-fork-node-options-injection
          - node-mcp-v2-fork-environment-data
          - node-mcp-v2-node-options-injection
          - node-mcp-v2-node-options-data
          - node-mcp-v2-executable-search-path
          - node-mcp-v2-fixed-executable-search

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: benchmarks/fixtures/${{ matrix.fixture }}/package-lock.json

      - name: Install exact fixture dependencies
        working-directory: benchmarks/fixtures/${{ matrix.fixture }}
        run: npm ci --ignore-scripts

      - name: Execute bounded exploit or negative-control witness
        working-directory: benchmarks/fixtures/${{ matrix.fixture }}
        run: npm run witness

  sails-action2-fixtures:
    name: Sails Action2 witness / ${{ matrix.os }} / ${{ matrix.fixture }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        fixture:
          - node-sails-action2-path-traversal
          - node-sails-action2-fixed-thumbnail
          - node-sails-action2-wrapper-path-traversal
          - node-sails-action2-wrapper-fixed-thumbnail

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22"

      - name: Execute bounded exploit or fixed-path control witness
        working-directory: benchmarks/fixtures/${{ matrix.fixture }}
        run: npm run witness
