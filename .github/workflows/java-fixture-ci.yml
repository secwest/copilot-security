name: java-fixture-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spring-security-fixtures:
    name: Spring fixtures and JDK witnesses
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: microsoft
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            benchmarks/fixtures/java-cross-file-template-injection/pom.xml
            benchmarks/fixtures/java-cross-file-safe-template/pom.xml
            benchmarks/fixtures/java-multi-hop-path-traversal/pom.xml
            benchmarks/fixtures/java-multi-hop-safe-path/pom.xml
            benchmarks/fixtures/java-multi-hop-ssrf/pom.xml
            benchmarks/fixtures/java-multi-hop-safe-fetch/pom.xml

      - name: Compile Spring benchmark fixtures
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress --file benchmarks/fixtures/java-cross-file-template-injection/pom.xml verify
          mvn --batch-mode --no-transfer-progress --file benchmarks/fixtures/java-cross-file-safe-template/pom.xml verify
          mvn --batch-mode --no-transfer-progress --file benchmarks/fixtures/java-multi-hop-path-traversal/pom.xml verify
          mvn --batch-mode --no-transfer-progress --file benchmarks/fixtures/java-multi-hop-safe-path/pom.xml verify
          mvn --batch-mode --no-transfer-progress --file benchmarks/fixtures/java-multi-hop-ssrf/pom.xml verify
          mvn --batch-mode --no-transfer-progress --file benchmarks/fixtures/java-multi-hop-safe-fetch/pom.xml verify

      - name: Prove vulnerable and safe path behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/java-path-vulnerable" "$RUNNER_TEMP/java-path-safe"
          javac -d "$RUNNER_TEMP/java-path-vulnerable" benchmarks/witnesses/java-multi-hop-path-traversal/VulnerablePathWitness.java
          java -cp "$RUNNER_TEMP/java-path-vulnerable" VulnerablePathWitness
          javac -d "$RUNNER_TEMP/java-path-safe" benchmarks/witnesses/java-multi-hop-safe-path/SafePathWitness.java
          java -cp "$RUNNER_TEMP/java-path-safe" SafePathWitness

      - name: Prove vulnerable and safe outbound-request behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/java-ssrf-vulnerable" "$RUNNER_TEMP/java-ssrf-safe"
          javac --add-modules jdk.httpserver -d "$RUNNER_TEMP/java-ssrf-vulnerable" benchmarks/witnesses/java-multi-hop-ssrf/VulnerableSsrfWitness.java
          java --add-modules jdk.httpserver -cp "$RUNNER_TEMP/java-ssrf-vulnerable" VulnerableSsrfWitness
          javac --add-modules jdk.httpserver -d "$RUNNER_TEMP/java-ssrf-safe" benchmarks/witnesses/java-multi-hop-safe-fetch/SafeFetchWitness.java
          java --add-modules jdk.httpserver -cp "$RUNNER_TEMP/java-ssrf-safe" SafeFetchWitness
