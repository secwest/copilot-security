name: rust-fixture-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  axum-command-fixtures:
    name: Axum command-injection fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Inspect Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          rustfmt --version

      - name: Parse Rust applications and compile witnesses
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 --check \
            benchmarks/fixtures/rust-axum-shell-command-injection/src/handlers/diagnostics.rs \
            benchmarks/fixtures/rust-axum-shell-command-injection/witness.rs \
            benchmarks/fixtures/rust-axum-argv-command/src/handlers/diagnostics.rs \
            benchmarks/fixtures/rust-axum-argv-command/witness.rs
          rustc --edition 2021 \
            benchmarks/fixtures/rust-axum-shell-command-injection/witness.rs \
            -o "$RUNNER_TEMP/rust-shell-command-witness"
          rustc --edition 2021 \
            benchmarks/fixtures/rust-axum-argv-command/witness.rs \
            -o "$RUNNER_TEMP/rust-argv-command-witness"

      - name: Prove shell grammar and literal argument behavior
        shell: bash
        run: |
          set -euo pipefail
          vulnerable="$(RUST_COMMAND_MARKER=rust-shell-expanded "$RUNNER_TEMP/rust-shell-command-witness")"
          control="$(RUST_COMMAND_MARKER=rust-shell-expanded "$RUNNER_TEMP/rust-argv-command-witness")"
          test "$vulnerable" = "shell_expanded_marker=1"
          test "$control" = "shell_expanded_marker=0"
