name: dotnet-fixture-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  aspnet-benchmarks:
    name: ASP.NET fixture exploit and controls
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Build ASP.NET fixtures
        run: |
          dotnet build benchmarks/fixtures/aspnet-cross-file-command-injection/AspnetCrossFileCommandInjection.csproj --configuration Release --nologo
          dotnet build benchmarks/fixtures/aspnet-cross-file-safe-command/AspnetCrossFileSafeCommand.csproj --configuration Release --nologo
          dotnet build benchmarks/fixtures/aspnet-cross-file-sql-injection/AspnetCrossFileSqlInjection.csproj --configuration Release --nologo
          dotnet build benchmarks/fixtures/aspnet-cross-file-safe-sql/AspnetCrossFileSafeSql.csproj --configuration Release --nologo
          dotnet build benchmarks/fixtures/aspnet-cross-file-ssrf/AspnetCrossFileSsrf.csproj --configuration Release --nologo
          dotnet build benchmarks/fixtures/aspnet-cross-file-safe-fetch/AspnetCrossFileSafeFetch.csproj --configuration Release --nologo
          dotnet build benchmarks/fixtures/aspnet-cross-file-template-injection/AspnetCrossFileTemplateInjection.csproj --configuration Release --nologo
          dotnet build benchmarks/fixtures/aspnet-cross-file-safe-template/AspnetCrossFileSafeTemplate.csproj --configuration Release --nologo
          dotnet build benchmarks/fixtures/aspnet-cross-file-razorlight-template-injection/AspnetCrossFileRazorLightTemplateInjection.csproj --configuration Release --nologo
          dotnet build benchmarks/fixtures/aspnet-cross-file-safe-razorlight-template/AspnetCrossFileSafeRazorLightTemplate.csproj --configuration Release --nologo
          dotnet build benchmarks/fixtures/aspnet-multi-hop-path-traversal/AspnetMultiHopPathTraversal.csproj --configuration Release --nologo
          dotnet build benchmarks/fixtures/aspnet-multi-hop-safe-path/AspnetMultiHopSafePath.csproj --configuration Release --nologo
          dotnet build benchmarks/fixtures/aspnet-cross-file-idor/AspnetCrossFileIdor.csproj --configuration Release --nologo
          dotnet build benchmarks/fixtures/aspnet-cross-file-safe-authorization/AspnetCrossFileSafeAuthorization.csproj --configuration Release --nologo
          dotnet build benchmarks/fixtures/aspnet-razor-page-sql-injection/AspnetRazorPageSqlInjection.csproj --configuration Release --nologo
          dotnet build benchmarks/fixtures/aspnet-razor-page-safe-sql/AspnetRazorPageSafeSql.csproj --configuration Release --nologo

      - name: Audit RazorLight fixture dependencies
        run: |
          audit_project() {
            project="$1"
            audit_file="$(mktemp)"
            dotnet list "$project" package --vulnerable --include-transitive --format json --source https://api.nuget.org/v3/index.json > "$audit_file"
            if jq -e '[.projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | select(((.vulnerabilities // []) | length) > 0)] | length > 0' "$audit_file" >/dev/null; then
              cat "$audit_file"
              echo "Vulnerable NuGet package detected in $project" >&2
              exit 1
            fi
          }
          audit_project benchmarks/fixtures/aspnet-cross-file-razorlight-template-injection/AspnetCrossFileRazorLightTemplateInjection.csproj
          audit_project benchmarks/fixtures/aspnet-cross-file-safe-razorlight-template/AspnetCrossFileSafeRazorLightTemplate.csproj
          audit_project benchmarks/fixtures/aspnet-cross-file-idor/AspnetCrossFileIdor.csproj
          audit_project benchmarks/fixtures/aspnet-cross-file-safe-authorization/AspnetCrossFileSafeAuthorization.csproj

      - name: Prove SQL, template, SSRF, path, and authorization exploits and controls
        run: |
          dotnet run --project benchmarks/witnesses/aspnet-cross-file-sql-injection/AspNetCrossFileSqlInjectionWitness.csproj --configuration Release
          dotnet run --project benchmarks/witnesses/aspnet-cross-file-safe-sql/AspNetCrossFileSafeSqlWitness.csproj --configuration Release
          dotnet run --project benchmarks/witnesses/aspnet-cross-file-ssrf/AspNetCrossFileSsrfWitness.csproj --configuration Release
          dotnet run --project benchmarks/witnesses/aspnet-cross-file-safe-fetch/AspNetCrossFileSafeFetchWitness.csproj --configuration Release
          dotnet run --project benchmarks/witnesses/aspnet-cross-file-template-injection/AspNetCrossFileTemplateInjectionWitness.csproj --configuration Release
          dotnet run --project benchmarks/witnesses/aspnet-cross-file-safe-template/AspNetCrossFileSafeTemplateWitness.csproj --configuration Release
          dotnet run --project benchmarks/witnesses/aspnet-cross-file-razorlight-template-injection/AspNetCrossFileRazorLightTemplateInjectionWitness.csproj --configuration Release
          dotnet run --project benchmarks/witnesses/aspnet-cross-file-safe-razorlight-template/AspNetCrossFileSafeRazorLightTemplateWitness.csproj --configuration Release
          dotnet run --project benchmarks/witnesses/aspnet-multi-hop-path-traversal/AspNetMultiHopPathTraversalWitness.csproj --configuration Release
          dotnet run --project benchmarks/witnesses/aspnet-multi-hop-safe-path/AspNetMultiHopSafePathWitness.csproj --configuration Release
          dotnet run --project benchmarks/witnesses/aspnet-cross-file-idor/AspnetCrossFileIdorWitness.csproj --configuration Release
          dotnet run --project benchmarks/witnesses/aspnet-cross-file-safe-authorization/AspnetCrossFileSafeAuthorizationWitness.csproj --configuration Release
          dotnet run --project benchmarks/witnesses/aspnet-razor-page-sql-injection/AspnetRazorPageSqlInjectionWitness.csproj --configuration Release
          dotnet run --project benchmarks/witnesses/aspnet-razor-page-safe-sql/AspnetRazorPageSafeSqlWitness.csproj --configuration Release
