services:
  copilot-security:
    image: ${COPILOT_SECURITY_IMAGE:-copilot-security:local}
    build:
      context: .
    init: true
    user: ${COPILOT_SECURITY_USER:-10001:10001}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=${COPILOT_SECURITY_SECCOMP:-./docker/copilot-security-seccomp.json}
    environment:
      COPILOT_GITHUB_TOKEN:
      COPILOT_SECURITY_GIT_HOST:
      GH_TOKEN:
      GITHUB_TOKEN:
    volumes:
      - type: bind
        source: ${COPILOT_SECURITY_CSV:-./repositories.csv}
        target: /input/repositories.csv
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COPILOT_SECURITY_RESULTS:-./results}
        target: /output
        bind:
          create_host_path: false
      - type: bind
        source: ${COPILOT_SECURITY_STATE:-./state}
        target: /state
        bind:
          create_host_path: false
    command:
      - bulk-scan
      - /input/repositories.csv
      - --output-dir
      - /output
